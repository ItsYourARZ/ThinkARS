  <script type="module">
    async function updateVisitorCount() {
      try {
        const res = await fetch("/.netlify/functions/updateVisitor");
        const data = await res.json();
        document.getElementById("visitor-count").innerText = data.count;
      } catch (err) {
        console.error("Visitor count error:", err);
      }
    }

    updateVisitorCount();

  </script>

  <script>
    function toggleInfo(e) {
      let t = e.closest(".run");
      t.classList.toggle("active");
    }

    document.addEventListener("DOMContentLoaded", function () {
      let elements = document.querySelectorAll(".fade-in");

      let observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("show");
              entry.target.style.animation = "fadeUp 1s ease";
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.2 }
      );

      elements.forEach((el) => {
        observer.observe(el);
      });

      document.body.style.opacity = 1;
    });

  </script>

  <script>
      const status = document.getElementById("status");

      grecaptcha.ready(async function () {
        try {
          const token = await grecaptcha.execute("__RECAPTCHA_SITE_KEY__", {
            action: "auto_verify",
          });

          const response = await fetch("/.netlify/functions/recaptcha-verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, action: "auto_verify" }),
          });

          const result = await response.json();

          if (response.ok) {
            status.textContent = result.message || "Verification successful!";
            console.log("reCAPTCHA verification success:", result);
          } else {
            status.textContent = result.message || "Verification failed";
            console.warn("reCAPTCHA verification failed:", result);
          }
        } catch (error) {
          status.textContent = "Verification error";
          console.error("Error verifying reCAPTCHA:", error);
        }
      });
  </script>
