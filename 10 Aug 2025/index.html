<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>HT Education News</title>
</head>
<body>
  <h1>Hindustan Times – Education News</h1>
  <div id="news"></div>

  <script>
    const feedURL = encodeURIComponent("https://www.hindustantimes.com/feeds/rss/education/rssfeed.xml");
    const url = `https://api.rss2json.com/v1/api.json?rss_url=${feedURL}`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("news");
        data.items.forEach(item => {
          const div = document.createElement("div");
          div.innerHTML = `
            <h2><a href="${item.link}" target="_blank">${item.title}</a></h2>
            <p>${item.pubDate}</p>
            <p>${item.description}</p>
          `;
          container.appendChild(div);
        });
      })
      .catch(err => console.error("Error fetching RSS:", err));
  </script>
</body>
</html>
