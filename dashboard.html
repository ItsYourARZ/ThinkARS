<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | It'sYourARZ</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body { background: radial-gradient(circle at top left, #001F3F, #000); display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:"Poppins",sans-serif; color:white; margin:0; }
.card { background: rgba(255,255,255,0.1); backdrop-filter: blur(25px); padding:40px; border-radius:20px; width:320px; text-align:center; border:1px solid rgba(255,255,255,0.2); animation: float 4s ease-in-out infinite; }
h1 { color:#00bfff; }
button { margin-top:20px; padding:10px 20px; background-color:#00bfff; border:none; border-radius:10px; cursor:pointer; color:white; transition:.3s; }
button:hover { background-color:#0099cc; }
@keyframes float {0%{transform:translateY(0);}50%{transform:translateY(-10px);}100%{transform:translateY(0);}}
</style>
</head>
<body>
<div class="card">
  <h1>Welcome 👋</h1>
  <p id="user-info">Loading...</p>
  <button id="logout-btn">Logout</button>
</div>

<script type="module">
import { auth, onAuthStateChanged, signOut } from './firebase-config.js';
const userInfo = document.getElementById("user-info");
const logoutBtn = document.getElementById("logout-btn");

onAuthStateChanged(auth, (user) => {
  if (user) userInfo.innerHTML = `<strong>${user.displayName || "User"}</strong><br>${user.email}`;
  else window.location.href = "index.html";
});

logoutBtn.addEventListener("click", async () => { await signOut(auth); window.location.href = "index.html"; });
</script>
</body>
</html>
