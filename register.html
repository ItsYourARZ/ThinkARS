<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email OTP Login | CodeARZ</title>
  <link rel="stylesheet" href="register.css">
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5;">

  <form class="form" id="emailForm">
    <h2 style="text-align:center;margin-bottom:10px;">📧 Email OTP Login</h2>

    <div class="flex-column">
      <label>Email Address</label>
      <div class="inputForm">
        <input type="email" id="email" placeholder="example@email.com" class="input" required />
      </div>
    </div>

    <button type="button" class="button-submit" id="sendLinkBtn">Send Login Link</button>

    <p class="p" id="statusMsg"></p>

    <p class="p" style="margin-top:10px;">— or —</p>

    <button type="button" class="btn" id="googleLogin">Sign in with Google</button>
    <button type="button" class="btn" id="githubLogin">Sign in with GitHub</button>
    <button type="button" class="btn" id="microsoftLogin">Sign in with Microsoft</button>
  </form>

  <script type="module" src="./register.css"></script>
</body>
</html>
