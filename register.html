<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup | It'sYourARZ</title>
  <link rel="stylesheet" href="register.css">
  <script type="module" src="register.js"></script>
</head>
<body>
  <form class="form" id="signup-form">
    <p class="title">Register</p>
    <p class="message">Signup now and get full access to our app.</p>

    <div class="flex">
      <label>
        <input class="input" type="text" id="firstname" required>
        <span>Firstname</span>
      </label>

      <label>
        <input class="input" type="text" id="lastname" required>
        <span>Lastname</span>
      </label>
    </div>  

    <label>
      <input class="input" type="email" id="email" required>
      <span>Email</span>
    </label> 
        
    <label>
      <input class="input" type="password" id="password" required>
      <span>Password</span>
    </label>

    <label>
      <input class="input" type="password" id="confirmPassword" required>
      <span>Confirm password</span>
    </label>

    <button class="submit" type="submit">Submit</button>
    <p class="signin">Already have an account? <a href="#">Signin</a></p>
  </form>
</body>
</html>
