<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Signup</title>
  <link rel="stylesheet" href="register.css"/>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #121212, #1e1e1e);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      padding: 40px;
      border-radius: 20px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #5865f2;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #4752c4;
    }

    .oauth-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    .link {
      color: #58a6ff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form class="form" id="signup-form">
    <h2>Create Account</h2>

    <div class="flex-column">
      <label>First Name</label>
      <div class="inputForm">
        <input type="text" id="firstname" class="input" placeholder="First Name" required />
      </div>
    </div>

    <div class="flex-column">
      <label>Last Name</label>
      <div class="inputForm">
        <input type="text" id="lastname" class="input" placeholder="Last Name" required />
      </div>
    </div>

    <div class="flex-column">
      <label>Email</label>
      <div class="inputForm">
        <input type="email" id="email" class="input" placeholder="Enter your Email" required />
      </div>
    </div>

    <div class="flex-column">
      <label>Password</label>
      <div class="inputForm">
        <input type="password" id="password" class="input" placeholder="Enter your Password" required />
      </div>
    </div>

    <div class="flex-column">
      <label>Confirm Password</label>
      <div class="inputForm">
        <input type="password" id="confirmPassword" class="input" placeholder="Confirm your Password" required />
      </div>
    </div>

    <button class="button-submit" type="submit">Sign Up</button>
    <p class="p">Already have an account? <span class="span" onclick="showLogin()">Sign In</span></p>

    <button class="btn" id="googleBtn">Continue with Google</button>
    <button class="btn" id="githubBtn">Continue with GitHub</button>
    <button class="btn" id="microsoftBtn">Continue with Microsoft</button>
  </form>

  <form class="form hidden" id="login-form">
    <h2>Sign In</h2>

    <div class="flex-column">
      <label>Email</label>
      <div class="inputForm">
        <input type="email" id="login-email" class="input" placeholder="Enter your Email" required />
      </div>
    </div>

    <div class="flex-column">
      <label>Password</label>
      <div class="inputForm">
        <input type="password" id="login-password" class="input" placeholder="Enter your Password" required />
      </div>
    </div>

    <button class="button-submit" type="submit">Sign In</button>
    <p class="p">Don't have an account? <span class="span" onclick="showSignup()">Create One</span></p>

    <button class="btn" id="googleBtnLogin">Continue with Google</button>
    <button class="btn" id="githubBtnLogin">Continue with GitHub</button>
    <button class="btn" id="microsoftBtnLogin">Continue with Microsoft</button>
  </form>

  <script type="module" src="./register.js"></script>
</body>
</html>
