<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Auth | CodeARZ</title>
  <link rel="stylesheet" href="register.css" />
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5;">

  <form class="form" id="phoneForm">
    <h2 style="text-align:center;margin-bottom:10px;">📱 Phone Login</h2>

    <div class="flex-column">
      <label>Phone Number</label>
      <div class="inputForm">
        <input type="text" id="phoneNumber" placeholder="+91 9876543210" class="input" />
      </div>
    </div>

    <div id="recaptcha-container" style="margin-top:10px;"></div>

    <button type="button" class="button-submit" id="sendOtpBtn">Send OTP</button>

    <div class="flex-column">
      <label>Enter OTP</label>
      <div class="inputForm">
        <input type="text" id="otp" placeholder="6-digit code" class="input" />
      </div>
    </div>

    <button type="button" class="button-submit" id="verifyOtpBtn">Verify OTP</button>

    <p class="p" id="statusMsg"></p>

    <p class="p" style="margin-top:10px;">— or —</p>

    <button type="button" class="btn" id="googleLogin">Sign in with Google</button>
    <button type="button" class="btn" id="githubLogin">Sign in with GitHub</button>
    <button type="button" class="btn" id="microsoftLogin">Sign in with Microsoft</button>
  </form>

  <script type="module" src="./register.js"></script>
</body>
</html>
