<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Signup</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #121212, #1e1e1e);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      padding: 40px;
      border-radius: 20px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #5865f2;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #4752c4;
    }

    .oauth-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    .link {
      color: #58a6ff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="formTitle">Create Account</h2>

    <!-- Signup Form -->
    <form id="signup-form">
      <input type="text" id="firstname" placeholder="First Name" required />
      <input type="text" id="lastname" placeholder="Last Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
      <button type="submit">Sign Up</button>

      <p>Already have an account? <span class="link" onclick="showLogin()">Sign In</span></p>
    </form>

    <!-- Login Form -->
    <form id="login-form" class="hidden">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Sign In</button>

      <p>Don’t have an account? <span class="link" onclick="showSignup()">Create One</span></p>
    </form>

    <div class="oauth-buttons">
      <button id="googleBtn">Continue with Google</button>
      <button id="githubBtn">Continue with GitHub</button>
      <button id="microsoftBtn">Continue with Microsoft</button>
    </div>
  </div>

  <script type="module" src="./register.js"></script>
</body>
</html>
