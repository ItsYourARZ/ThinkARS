<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Link Auth | Firebase</title>
  <script type="module" src="./register.js"></script>
  <style>
    /* === your form style === */
    .form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #ffffff;
      padding: 30px;
      width: 450px;
      border-radius: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 50px auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    ::placeholder { font-family: inherit; }

    .inputForm {
      border: 1.5px solid #ecedec;
      border-radius: 10px;
      height: 50px;
      display: flex;
      align-items: center;
      padding-left: 10px;
      transition: 0.2s ease-in-out;
    }

    .input { margin-left: 10px; border: none; width: 85%; height: 100%; border-radius: 10px; }
    .input:focus { outline: none; }
    .inputForm:focus-within { border: 1.5px solid #2d79f3; }

    .button-submit {
      margin: 20px 0 10px 0;
      background-color: #151717;
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 500;
      border-radius: 10px;
      height: 50px;
      width: 100%;
      cursor: pointer;
    }

    .button-submit:hover { background-color: #252727; }
  </style>
</head>
<body>
  <div class="form">
    <h2>Email OTP Login</h2>
    <div class="inputForm">
      <input type="email" id="email" class="input" placeholder="Enter your email" required>
    </div>
    <button id="sendLinkBtn" class="button-submit">Send Sign-In Link</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAARY3XCb_p0KpVPRsUh-zN8DY_OxkgisE",
      authDomain: "the-ars-team.firebaseapp.com",
      projectId: "the-ars-team",
      appId: "1:247839744361:web:1d8f1e637659d5efb71df8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // === Send Email Link ===
    document.getElementById("sendLinkBtn").onclick = async () => {
      const email = document.getElementById("email").value;
      if (!email) return alert("Enter an email!");

      const actionCodeSettings = {
        url: window.location.href, // user returns to this same page
        handleCodeInApp: true,
      };

      try {
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        window.localStorage.setItem("emailForSignIn", email);
        alert("Sign-in link sent! Check your email inbox.");
      } catch (error) {
        alert("Error: " + error.message);
      }
    };

    // === Check if it's an email link ===
    if (isSignInWithEmailLink(auth, window.location.href)) {
      let email = window.localStorage.getItem("emailForSignIn");
      if (!email) {
        email = window.prompt("Please provide your email for confirmation:");
      }

      signInWithEmailLink(auth, email, window.location.href)
        .then(result => {
          alert("Welcome " + result.user.email + " 🎉");
          window.localStorage.removeItem("emailForSignIn");
        })
        .catch(err => {
          alert("Error signing in: " + err.message);
        });
    }
  </script>
</body>
</html>
